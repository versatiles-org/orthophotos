version: 2
updates:
  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
    groups:
      all:
        patterns:
          - '*'
      security:
        applies-to: security-updates
        patterns:
          - '*'

  # npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'deps'
    groups:
      all:
        patterns:
          - '*'
      security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # typescript-eslint peers on `>=4.8.4 <6.1.0`, and other tooling lags the same way, so a
      # TypeScript 7 bump breaks `npm ci` outright. Drop this once typescript-eslint accepts 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
